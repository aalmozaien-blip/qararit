        ["Enfants", ["Les enfants peuvent utiliser le Défi familial avec leur famille. Aucune donnée personnelle n’est collectée à leur sujet ; leurs résultats restent dans le conseil, sur l’appareil."]],
        ["Vos droits", ["Vous pouvez arrêter la mesure sur cet appareil à tout moment avec le bouton ci-dessous ; le site fonctionne entièrement sans elle.", "Si votre navigateur envoie « Do Not Track » ou « Global Privacy Control », votre visite n’est pas mesurée.", "Pour toute question de confidentialité, écrivez-nous à Mr.waelbinali@gmail.com."]]
      ],
      ctl: "Arrêter la mesure sur cet appareil", on: "La mesure est active sur cet appareil (données agrégées et anonymes).", off: "La mesure est désactivée sur cet appareil.",
      dnt: "Votre navigateur demande à ne pas être suivi : votre visite n’est pas mesurée.", na: "La mesure n’est pas encore activée sur le site : rien n’est envoyé.",
      stop: "Arrêter la mesure", resume: "Réactiver la mesure", updated: "Dernière mise à jour : novembre 2026", home: "We Have Let So Many Qirats Slip Away",
      draft: "Traduction initiale en attente de relecture. Le texte arabe fait foi."
    }
  };
  var REG = window.QARARIT_LOCALES;
  function pick() {
    var m = /[?&]lang=([a-z]{2,3})/.exec(location.search), s = null;
    try { s = localStorage.getItem("qararit.lang"); } catch (e) {}
    return (m && TX[m[1]] && m[1]) || (s && TX[s] && s) || "ar";
  }
  function el(tag, text) { var e = document.createElement(tag); if (text != null) e.textContent = text; return e; }
  var lang = pick();
  function paint() {
    var L = TX[lang], info = REG.list.filter(function (x) { return x.code === lang; })[0];
    document.documentElement.lang = lang; document.documentElement.dir = info.dir;
    document.title = L.title + " | " + L.home;
    document.getElementById("title").textContent = L.title;
    var home = document.getElementById("home");
    home.textContent = L.home; home.href = lang === "ar" ? "../" : "../" + lang + "/";
    var d = document.getElementById("draft"); d.textContent = L.draft; d.hidden = !L.draft;
    var body = document.getElementById("body"); body.innerHTML = "";
    L.sections.forEach(function (s) {
      var sec = el("section"); sec.appendChild(el("h2", s[0]));
      if (s[1].length === 1) sec.appendChild(el("p", s[1][0]));
      else { var ul = el("ul"); s[1].forEach(function (x) { ul.appendChild(el("li", x)); }); sec.appendChild(ul); }
      body.appendChild(sec);
    });
    document.getElementById("ctl-h").textContent = L.ctl;
    var st = window.QA ? QA.status : null, btn = document.getElementById("ctl-btn"), msg = document.getElementById("ctl-status");
    btn.hidden = false;
    if (!st) { msg.textContent = L.na; btn.hidden = true; }
    else if (st.dnt) { msg.textContent = L.dnt; btn.hidden = true; }
    else if (st.optedOut) { msg.textContent = L.off; btn.textContent = L.resume; }
    else { msg.textContent = st.configured ? L.on : L.na; btn.textContent = L.stop; }
    document.getElementById("updated").textContent = L.updated;
    var langs = document.getElementById("langs"); langs.innerHTML = "";
    REG.list.forEach(function (x) {
      var b = el("button", x.name); b.type = "button"; b.lang = x.code; b.setAttribute("aria-pressed", String(x.code === lang));
      b.onclick = function () { lang = x.code; paint(); };
      langs.appendChild(b);
    });
  }
  document.getElementById("ctl-btn").onclick = function () {
    if (!window.QA) return;
    if (QA.status.optedOut) { QA.optIn(); location.reload(); } else { QA.optOut(); paint(); }
  };
  paint();
})();
</script>
